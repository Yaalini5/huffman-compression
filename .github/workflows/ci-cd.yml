name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-cpp:
    name: Compile and round-trip test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huffman-compressor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile Huffman engine
        run: g++ huffman-compression.cpp -O2 -std=c++17 -Wall -Wextra -pedantic -o huffman

      - name: Verify compression round trip
        shell: bash
        run: |
          printf 'Huffman CI round-trip test\nRepeated text improves compression.\n' > original.txt
          ./huffman -c original.txt
          ./huffman -dc original.txt.abiz
          cmp -- original.txt outputoriginal.txt

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test-cpp
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./huffman-compressor
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/huffman-compression:latest